name: Release

# A pushed tag vX.Y.Z (created by tools/release.py) is a release:
#   1. validate the content graph and build the production package
#   2. publish a GitHub Release with the zip attached (the backup of that version)
#   3. update the `deploy` branch, which the server pulls, and tag it deploy-vX.Y.Z
# Roll back with the "Rollback" workflow, which points `deploy` at any earlier deploy-vX.Y.Z tag.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the content graph
        run: python3 tools/build-content.py && git diff --exit-code --stat -- data/content
      - name: Version must match the tag
        run: |
          V=$(cat VERSION); T="${GITHUB_REF_NAME#v}"
          [ "$V" = "$T" ] || { echo "VERSION file ($V) does not match tag ($T)"; exit 1; }
      - name: Build the production package
        run: python3 tools/package-site.py --site-url "${{ vars.SITE_URL || 'https://anatomynexus.com' }}" --pretty --zip --out dist
      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME}" 'BEGIN{p=0} /^## /{ if (p) exit; if (index($0, v) > 0) p=1; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}" > notes.md
          cp dist/human-body-site.zip "human-body-site-${GITHUB_REF_NAME}.zip"
      - name: Publish the GitHub Release (backup of this version)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: human-body-site-${{ github.ref_name }}.zip
      - name: Remove the zip from the deploy tree
        run: rm -f dist/human-body-site.zip
      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: "Production build ${{ github.ref_name }} (${{ github.sha }})"
      - name: Tag the deploy branch as deploy-${{ github.ref_name }}
        run: |
          git fetch origin deploy
          git tag -f "deploy-${GITHUB_REF_NAME}" origin/deploy
          git push origin "refs/tags/deploy-${GITHUB_REF_NAME}" --force
          echo "deploy branch now at $(git rev-parse --short origin/deploy); the server pulls it within five minutes"
