name: Deploy to GitHub Pages

# Publishes the static site. Enable Pages in the repository settings with "GitHub Actions" as
# the source, then push to main (or run this workflow manually from any branch).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright (prerendering)
        working-directory: tools/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the production package
        run: python3 tools/package-site.py --site-url "${{ vars.SITE_URL || 'https://anatomynexus.com' }}" --pretty --prerender --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
