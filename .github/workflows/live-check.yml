name: Live site check

# Runs the full smoke test against a deployed copy of the site (default: the Hostinger
# subdomain), from GitHub's runners: HTTPS, clean URLs, headers, every page, the explorer.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployed site
        required: false
        default: https://anatomynexus.com/
      pretty_urls:
        description: "Clean URLs enabled on that host (1 or 0)"
        required: false
        default: "1"
      redirect_from:
        description: Old host name that must redirect to the site (blank to skip)
        required: false
        default: medical.mjunaid.net

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: tools/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Headers and status of key URLs
        run: |
          B="${{ github.event.inputs.base_url || 'https://anatomynexus.com/' }}"
          for p in "" "explorer/" "conditions/gout" "sitemap.xml" "data/hd/glb/heart.glb" "no-such-page"; do
            echo "== ${B}${p}"; curl -sS -o /dev/null -I -H "Accept-Encoding: gzip, br" -w "status %{http_code}  type %{content_type}\n" "${B}${p}" || true
          done
          echo "== security headers"; curl -sSI "${B}" | grep -iE "^(content-security-policy|strict-transport-security|x-content-type-options|referrer-policy|content-encoding|cache-control)" || true
      - name: Old host redirects to the canonical site
        if: ${{ github.event.inputs.redirect_from != '' }}
        run: |
          H="${{ github.event.inputs.redirect_from || 'medical.mjunaid.net' }}"
          for p in "" "conditions/gout" "explorer/"; do
            echo "== https://${H}/${p}"; curl -sS -o /dev/null -I -w "status %{http_code}  location %{redirect_url}\n" "https://${H}/${p}"
          done
          code=$(curl -sS -o /dev/null -I -w "%{http_code}" "https://${H}/conditions/gout"); loc=$(curl -sS -o /dev/null -I -w "%{redirect_url}" "https://${H}/conditions/gout")
          case "$code $loc" in 301*anatomynexus.com/conditions/gout*|308*anatomynexus.com/conditions/gout*) echo "redirect ok";; *) echo "redirect NOT as expected: $code $loc"; exit 1;; esac
      - name: Full smoke test against the live site
        working-directory: tools/qa
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://anatomynexus.com/' }}
          PRETTY_URLS: ${{ github.event.inputs.pretty_urls || '1' }}
        run: node smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-screenshots
          path: tools/qa/shots
          if-no-files-found: ignore
