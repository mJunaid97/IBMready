name: Live site check

# Runs the full smoke test against the deployed site from GitHub's runners: HTTPS, one canonical host,
# clean URLs and the 301 rules, headers, sitemaps, every page (prerendered HTML), the explorer.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployed site
        required: false
        default: https://anatomynexus.com/
      redirect_from:
        description: Old host name that must redirect to the site (blank to skip)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: tools/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Status, type and canonical rules of key URLs
        run: |
          B="${{ github.event.inputs.base_url || 'https://anatomynexus.com/' }}"
          H=$(echo "$B" | sed -E 's#https?://([^/]+)/?#\1#')
          for p in "" "anatomy/heart/" "conditions/gout/" "medications/amlodipine/" "explorer/" "sitemap.xml" "sitemaps/conditions.xml" "data/hd/glb/heart.glb" "site/previews/o-heart.jpg" "no-such-page"; do
            echo "== ${B}${p}"; curl -sS -o /dev/null -I -H "Accept-Encoding: gzip, br" -w "status %{http_code}  type %{content_type}\n" "${B}${p}" || true
          done
          echo "== redirects (expect 301 to the canonical URL, one hop)"
          for p in "conditions/gout" "tests/cbc/" "medications/norvasc/" "organs/heart/" "learn/terminology.html" "conditions/condition.html?id=gout" "index.html"; do
            printf "%-40s " "$p"; curl -sS -o /dev/null -I -w "%{http_code} -> %{redirect_url}\n" "${B}${p}" || true
          done
          printf "%-40s " "http://www.$H/"; curl -sS -o /dev/null -I -w "%{http_code} -> %{redirect_url}\n" "http://www.$H/" || true
          printf "%-40s " "https://www.$H/"; curl -sS -o /dev/null -I -w "%{http_code} -> %{redirect_url}\n" "https://www.$H/" || true
          echo "== security headers"; curl -sSI "${B}" | grep -iE "^(content-security-policy|strict-transport-security|x-content-type-options|referrer-policy|content-encoding|cache-control)" || true
          echo "== initial HTML of an entity page"; curl -sS "${B}conditions/gout/" | grep -oE "<title>[^<]+</title>|<link rel=\"canonical\"[^>]+>|<meta name=\"robots\"[^>]+>|<h1[^>]*>[^<]+</h1>|data-prerendered" | head -6
      - name: Old host redirects to the canonical site
        if: ${{ github.event.inputs.redirect_from != '' }}
        run: |
          H="${{ github.event.inputs.redirect_from }}"
          for p in "" "conditions/gout/" "explorer/"; do
            echo "== https://${H}/${p}"; curl -sS -o /dev/null -I -w "status %{http_code}  location %{redirect_url}\n" "https://${H}/${p}"
          done
          code=$(curl -sS -o /dev/null -I -w "%{http_code}" "https://${H}/conditions/gout/"); loc=$(curl -sS -o /dev/null -I -w "%{redirect_url}" "https://${H}/conditions/gout/")
          case "$code $loc" in 301*anatomynexus.com/conditions/gout*|308*anatomynexus.com/conditions/gout*) echo "redirect ok";; *) echo "redirect NOT as expected: $code $loc"; exit 1;; esac
      - name: Full smoke test against the live site
        working-directory: tools/qa
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://anatomynexus.com/' }}
          PRETTY_URLS: "1"
          PRERENDERED: "1"
        run: node smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-screenshots
          path: tools/qa/shots
          if-no-files-found: ignore
