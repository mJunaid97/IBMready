name: Deploy to Hostinger (manual)

# Manual deployment of any branch or commit, outside the versioned release flow. Normal releases
# go through tools/release.py -> the Release workflow; rollbacks through the Rollback workflow.
# The build is published to the `deploy` branch, which the server pulls every five minutes.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public URL of the site (overrides the SITE_URL variable)
        required: false

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the content graph
        run: python3 tools/build-content.py && git diff --exit-code --stat -- data/content site/site-meta.js
      - name: Install Playwright (prerendering)
        working-directory: tools/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the production package
        run: python3 tools/package-site.py --site-url "${{ github.event.inputs.site_url || vars.SITE_URL || 'https://anatomynexus.com' }}" --pretty --prerender --out dist
      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: "Production build ${{ github.sha }}"
