<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmap · Human Body</title>
  <meta name="description" content="The phased plan for the Human Body Knowledge Platform: what is live, what comes next, and the entity model that ties anatomy to symptoms, conditions, tests, procedures and learning.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../site/site.css">
</head>
<body>
<main class="wrap">
  <div class="breadcrumb"><a href="../index.html">Home</a> › Roadmap</div>
  <h1>Roadmap</h1>
  <p class="lead" id="vision"></p>
  <div class="two">
    <div>
      <h2>Phases</h2>
      <div id="phases"></div>
      <h2>Planned sections</h2>
      <div id="sections"></div>
    </div>
    <aside class="aside">
      <h3>Entity model</h3>
      <p class="muted small">Reusable entities with explicit relationships, so no page is an island. Details in <a href="../ARCHITECTURE.md">ARCHITECTURE.md</a>.</p>
      <div id="entities"></div>
    </aside>
  </div>
</main>
<script type="module">
  import { renderHeader, renderFooter, ROOT, esc } from '../site/site.js';
  renderHeader('roadmap'); renderFooter();
  const rm = await fetch(ROOT + 'content/roadmap.json').then(r => r.json());
  document.getElementById('vision').textContent = rm.vision;
  const badge = (s) => `<span class="badge ${s === 'live' ? 'live' : s === 'started' ? '' : 'planned'}">${s}</span>`;
  document.getElementById('phases').innerHTML = rm.phases.map(p => `<section class="phase" id="${p.id}"><h3>${esc(p.name)} ${badge(p.status)}</h3><p class="muted small">${esc(p.summary)}</p><ul>${p.items.map(i => `<li>${i.href ? `<a href="${ROOT}${i.href}">${esc(i.name)}</a>` : i.anchor ? `<a href="#${i.anchor}">${esc(i.name)}</a>` : esc(i.name)} ${badge(i.status)}</li>`).join('')}</ul></section>`).join('');
  document.getElementById('sections').innerHTML = rm.sections.map(s => `<section class="term" id="${s.id}"><h3>${esc(s.name)} <span class="badge planned">planned</span></h3><p>${esc(s.summary)}</p></section>`).join('');
  document.getElementById('entities').innerHTML = rm.entities.map(e => `<div class="term" style="padding:10px 0"><b>${esc(e.name)}</b> ${badge(e.status)}<div class="muted small">${esc(e.note)}</div><div class="mono muted">${esc(e.where)}</div></div>`).join('');
  if (location.hash) setTimeout(() => document.getElementById(location.hash.slice(1))?.scrollIntoView({ block: 'start' }), 50);
</script>
</body>
</html>
