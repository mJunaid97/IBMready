<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · Human Body</title>
  <meta name="description" content="Search every structure, organ, system, term, condition, symptom, test, imaging study, procedure, medication, first-aid and health topic on the Human Body platform.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../site/site.css">
</head>
<body>
<main class="wrap" id="main">
  <div class="breadcrumb"><a href="../index.html">Home</a> › Search</div>
  <h1>Search everything</h1>
  <p class="lead">One index over the whole platform: <span id="count">…</span> structures, organs, systems, regions, terms and clinical topics.</p>
  <div class="search-row"><input id="q" type="search" placeholder="Try: femur, chest pain, ECG, statin, knee…" aria-label="Search" autofocus></div>
  <div class="filters" id="filters"></div>
  <div id="results"></div>
</main>
<script type="module">
  import { renderHeader, renderFooter, searchEntries, runSearch, anyLink, TYPE_LABEL, TYPES, esc, param } from '../site/site.js';
  renderHeader('search'); renderFooter();
  const q = document.getElementById('q'), out = document.getElementById('results'), filters = document.getElementById('filters');
  const entries = await searchEntries();
  document.getElementById('count').textContent = entries.length.toLocaleString('en-US');
  const types = ['all', 'structure', 'organ', 'system', 'term', 'conditions', 'symptoms', 'physiology', 'tests', 'imaging', 'procedures', 'medications', 'first-aid', 'health'];
  let type = 'all';
  filters.innerHTML = types.map(t => `<button class="chip ${t === 'all' ? 'is-active' : ''}" data-t="${t}">${t === 'all' ? 'All' : esc(TYPE_LABEL[t] || t)}</button>`).join('');
  filters.addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (!b) return; type = b.dataset.t; for (const x of filters.children) x.classList.toggle('is-active', x === b); render(); });
  function render() {
    const s = q.value.trim();
    const pool = type === 'all' ? entries : entries.filter(e => e.type === type);
    if (!s) { out.innerHTML = `<p class="muted">Type to search${type !== 'all' ? ` within ${esc(TYPE_LABEL[type] || type)}` : ''}. Results link straight to the page or into the 3D atlas.</p>`; return; }
    const res = runSearch(pool, s, 60);
    if (!res.length) { out.innerHTML = '<p class="muted">No matches. Try a shorter word, an alias (heart attack, blood thinner) or a Latin name.</p>'; return; }
    const groups = new Map(); for (const r of res) { if (!groups.has(r.type)) groups.set(r.type, []); groups.get(r.type).push(r); }
    out.innerHTML = [...groups].map(([t, list]) => `<div class="result-group"><h2>${esc(TYPE_LABEL[t] || t)} <span class="badge">${list.length}</span></h2><ul class="list">${list.map(r => `<li><a href="${anyLink(r.type, r.id)}">${esc(r.name)}</a> <span class="muted small">· ${esc(r.sub)}</span></li>`).join('')}</ul></div>`).join('');
    const u = new URL(location.href); u.searchParams.set('q', s); history.replaceState(null, '', u);
  }
  q.value = param('q') || ''; q.addEventListener('input', render); render();
</script>
</body>
</html>
