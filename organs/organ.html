<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organ · Human Body</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../site/site.css">
</head>
<body>
<main class="wrap" id="main"><p class="muted" style="padding:40px 0">Loading…</p></main>
<script type="module">
  import { renderHeader, renderFooter, loadData, loadClinical, link, termLink, esc, param } from '../site/site.js';
  import { relatedForAnatomy, relatedCountForAnatomy } from '../site/entity.js';
  renderHeader('organs'); renderFooter();
  const [data, clinical] = await Promise.all([loadData(), loadClinical()]); const { atlas, content, terms } = data;
  const id = param('id'); const o = content.organs.find(x => x.id === id);
  const main = document.getElementById('main');
  if (!o) { main.innerHTML = '<h1>Organ not found</h1><p><a href="index.html">All organs</a></p>'; throw new Error('no organ'); }
  const sys = atlas.systems.find(s => s.id === o.system); const region = content.regions.find(r => r.id === o.region);
  document.title = `${o.name} · Organs · Human Body`;
  const structs = o.structures.map(i => atlas.structures[i]);
  const others = content.organs.filter(x => x.system === o.system && x.id !== o.id);
  const relTerms = terms.terms.filter(t => t.atlas && (t.atlas.organ === o.id || (t.atlas.structure && structs.some(s => s.name === t.atlas.structure))));
  const systemText = content.systems[o.system] || {};
  main.innerHTML = `
    <div class="breadcrumb"><a href="../index.html">Home</a> › <a href="index.html">Organs</a> › ${esc(o.name)}</div>
    <div class="eyebrow">Organ · <a href="../systems/system.html?id=${o.system}" style="text-decoration:none">${esc(sys ? sys.name : o.system)}</a>${region ? ` · <a href="${link.region(region.id)}" style="text-decoration:none">${esc(region.name)}</a>` : ''}</div>
    <h1>${esc(o.name)}</h1>
    <p class="lead">${esc(o.summary)}</p>
    <div class="actions">
      <a class="btn btn-primary" href="${link.organ(o.id)}">Open in 3D</a>
      <a class="btn" href="${link.system(o.system)}">Show its system</a>
    </div>
    <div class="embed"><iframe src="${link.embed('o=' + o.id)}" title="3D view of the ${esc(o.name)}" loading="lazy" allow="fullscreen"></iframe></div>
    <div class="two">
      <div>
        <h2>Structures <span class="badge">${structs.length}</span></h2>
        <p class="muted small">The modelled pieces that make up this organ. Click one to open it in the atlas.</p>
        <ul class="list">${structs.map(s => `<li><a href="${link.structure(s.id)}">${esc(s.name)}</a>${s.pieces.length > 1 ? ` <span class="muted small">· ${s.pieces.length} pieces</span>` : ''}</li>`).join('')}</ul>
        ${structs.length === 1 && content.structures[structs[0].id] ? `<h2>About</h2><p>${esc(content.structures[structs[0].id].summary || '')}</p>${content.structures[structs[0].id].function ? `<p><b>Function.</b> ${esc(content.structures[structs[0].id].function)}</p>` : ''}${content.structures[structs[0].id].clinical ? `<p><b>Clinical note.</b> ${esc(content.structures[structs[0].id].clinical)}</p>` : ''}` : ''}
        <h2>The ${esc(sys ? sys.name.toLowerCase() : '')} in brief</h2>
        <p>${esc(systemText.overview || sys?.summary || '')}</p>
      </div>
      <aside class="aside">
        ${relTerms.length ? `<h3>Related terms</h3><div class="chips">${relTerms.map(t => `<a class="chip" href="../learn/terminology.html#${t.id}">${esc(t.term)}</a>`).join('')}</div>` : ''}
        ${others.length ? `<h3>Also in this system</h3><div class="chips">${others.map(x => `<a class="chip" href="organ.html?id=${x.id}">${esc(x.name)}</a>`).join('')}</div>` : ''}
        ${relatedForAnatomy('organs', o.id, clinical, `Clinical topics · ${relatedCountForAnatomy('organs', o.id, clinical)}`) || `<h3>Clinical topics</h3><p class="muted small">No physiology, condition, test or procedure pages mention the ${esc(o.name.toLowerCase())} yet. <a href="../search/index.html?q=${encodeURIComponent(o.name)}">Search the platform.</a></p>`}
      </aside>
    </div>`;
</script>
</body>
</html>
